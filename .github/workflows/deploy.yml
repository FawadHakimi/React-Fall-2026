name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Midterm/package-lock.json
            Task4/package-lock.json

      # Midterm (stays at https://fawadhakimi.github.io/React-Fall-2026/)
      - name: Build Midterm
        working-directory: Midterm
        run: |
          npm ci
          npm run build

      # Task 4 (goes to https://fawadhakimi.github.io/React-Fall-2026/Task4/)
      - name: Build Task4
        working-directory: Task4
        run: |
          npm ci
          npm run build

      # Put both apps into one folder called "site"
      - name: Assemble site
        run: |
          mkdir -p site/Task4
          cp -r Midterm/dist/. site/
          cp -r Task4/dist/. site/Task4/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
